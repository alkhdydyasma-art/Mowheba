<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="الملف الإلكتروني التشغيلي لرعاية الطالبات الموهوبات — المتوسطة الثانية بالمبرز">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ملف رعاية الموهوبات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: official-dossier app — header band with geometric seal, right-side section index (RTL), working sheets on the left. */
:root{
  --bg:#F3F5F3; --surface:#FFFFFF; --sunk:#EBF0EE; --line:#D7E0DC; --line-strong:#B9C7C2;
  --ink:#14302F; --ink-2:#4A625F; --ink-3:#7A8E8A;
  --brand:#0E5E5C; --brand-ink:#FFFFFF; --brand-soft:#E1EFEC;
  --gold:#A7823A; --gold-soft:#F5EEDD;
  --good:#2E7D4F; --good-soft:#E3F2E8; --warn:#A86B12; --warn-soft:#FBF0DC; --bad:#B03A2E; --bad-soft:#F8E4E1;
  --band:#0F3E3D; --band-ink:#EAF3F1; --band-2:#165553;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(15,62,61,.06),0 4px 14px rgba(15,62,61,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1716; --surface:#13211F; --sunk:#0F1C1B; --line:#233533; --line-strong:#33504C;
  --ink:#E4EEEB; --ink-2:#A9BDB8; --ink-3:#7E948F;
  --brand:#4FB0A8; --brand-ink:#08201F; --brand-soft:#173230;
  --gold:#D3B06A; --gold-soft:#2B2617;
  --good:#6CC08E; --good-soft:#15291D; --warn:#E0A64A; --warn-soft:#2D2312; --bad:#E77B6E; --bad-soft:#2E1714;
  --band:#0A2423; --band-ink:#E4EEEB; --band-2:#123634;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1716; --surface:#13211F; --sunk:#0F1C1B; --line:#233533; --line-strong:#33504C;
  --ink:#E4EEEB; --ink-2:#A9BDB8; --ink-3:#7E948F;
  --brand:#4FB0A8; --brand-ink:#08201F; --brand-soft:#173230;
  --gold:#D3B06A; --gold-soft:#2B2617;
  --good:#6CC08E; --good-soft:#15291D; --warn:#E0A64A; --warn-soft:#2D2312; --bad:#E77B6E; --bad-soft:#2E1714;
  --band:#0A2423; --band-ink:#E4EEEB; --band-2:#123634;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}

/* header band */
.band{background:var(--band);color:var(--band-ink);position:relative;overflow:hidden}
.band::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0);background-size:18px 18px;pointer-events:none}
.band-in{max-width:1320px;margin:0 auto;padding-block:22px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:18px;align-items:center;flex-wrap:wrap;position:relative;z-index:1}
.seal{width:58px;height:58px;flex:none}
.titles{flex:1;min-width:220px}
.eyebrow{font-size:12px;letter-spacing:.04em;color:var(--gold);font-weight:600}
.titles h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3.2vw,30px);margin:2px 0 4px;line-height:1.3;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;opacity:.85}
.meta b{font-weight:600;color:var(--band-ink)}
.band-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.save-state{font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.08);white-space:nowrap}
.save-state.err{background:var(--bad);color:#fff}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 14px;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--brand);background:var(--brand-soft)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--brand)}
.btn.ghost-band{background:transparent;border-color:rgba(255,255,255,.28);color:var(--band-ink)}
.btn.ghost-band:hover{background:rgba(255,255,255,.1);border-color:var(--gold)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* shell */
.shell{max-width:1320px;margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
nav.index{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--shadow)}
.index-h{font-family:var(--f-display);font-size:14px;color:var(--ink-2);padding:6px 10px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.nav-item{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;width:100%;text-align:right;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
.nav-item:hover{background:var(--sunk)}
.nav-item.on{background:var(--brand-soft);color:var(--brand)}
.nav-item.on .nav-code{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.nav-code{width:28px;height:28px;border-radius:7px;border:1px solid var(--line-strong);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;color:var(--ink-2)}
.nav-label{font-size:14px;font-weight:500;line-height:1.35}
.nav-pct{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav-bar{grid-column:2/4;height:3px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:-2px}
.nav-bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
main{min-width:0;display:flex;flex-direction:column;gap:18px}

/* section header */
.sec-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:14px}
.sec-num{font-family:var(--f-display);font-size:13px;color:var(--gold);font-weight:600}
.sec-head h2{font-family:var(--f-display);font-weight:600;font-size:clamp(21px,2.6vw,27px);margin:0;line-height:1.3;text-wrap:balance}
.sec-head .grow{flex:1;min-width:220px}
.pill-pct{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);margin-top:4px}
.pill-pct .bar{width:120px;height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.pill-pct .bar i{display:block;height:100%;background:var(--gold)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0;display:flex;align-items:center;gap:8px}
.card-h h3 .tag{font-family:var(--f-body);font-size:11.5px;font-weight:600;color:var(--gold);background:var(--gold-soft);padding:1px 8px;border-radius:99px}
.card-b{padding:16px}
.desc{border-inline-start:4px solid var(--gold);background:linear-gradient(to left,var(--gold-soft),var(--surface) 70%)}
.desc .card-b p{margin:0;max-width:78ch;color:var(--ink);font-size:15.5px;line-height:1.95}
.desc .lbl{font-size:12px;font-weight:600;color:var(--gold);letter-spacing:.03em;margin-bottom:6px;display:block}

/* forms */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.inp,.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:7px;padding:8px 10px;font-size:14.5px;transition:border-color .15s,background .15s}
.field textarea{resize:vertical;min-height:76px;line-height:1.8}
.inp:hover,.field input:hover,.field textarea:hover{border-color:var(--line-strong)}
.inp:focus,.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--brand);background:var(--surface)}
.field .hint{font-size:12px;color:var(--ink-3)}

/* tables */
.tbl-wrap{overflow-x:auto;border-top:1px solid var(--line)}
table.sheet{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
table.sheet th{background:var(--band);color:var(--band-ink);font-weight:600;font-size:13px;padding:9px 8px;text-align:right;white-space:nowrap;position:sticky;top:0}
table.sheet th:first-child{width:38px;text-align:center}
table.sheet td{border-bottom:1px solid var(--line);padding:4px;vertical-align:middle}
table.sheet tr:nth-child(even) td{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
table.sheet td.n{text-align:center;color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:13px}
table.sheet td input,table.sheet td select{width:100%;min-width:110px;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;font-size:14px}
table.sheet td input:hover,table.sheet td select:hover{border-color:var(--line)}
table.sheet td input:focus,table.sheet td select:focus{outline:none;border-color:var(--brand);background:var(--surface)}
table.sheet td.calc{font-weight:600;font-variant-numeric:tabular-nums;color:var(--brand);padding-inline:10px;white-space:nowrap}
table.sheet td.act{width:40px;text-align:center}
.icon-btn{border:0;background:transparent;color:var(--ink-3);cursor:pointer;width:30px;height:30px;border-radius:6px;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--bad-soft);color:var(--bad)}
.icon-btn svg{width:15px;height:15px}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap}
.tbl-foot .count{font-size:12.5px;color:var(--ink-3)}
select.st{font-weight:600;border-radius:99px!important;padding:4px 10px!important}
select.st[data-v="done"]{background:var(--good-soft)!important;color:var(--good)}
select.st[data-v="doing"]{background:var(--warn-soft)!important;color:var(--warn)}
select.st[data-v="todo"]{background:var(--sunk)!important;color:var(--ink-2)}
select.st[data-v="late"]{background:var(--bad-soft)!important;color:var(--bad)}

/* lists */
.steps{display:flex;flex-wrap:wrap;gap:0;counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{flex:1 1 150px;position:relative;padding:12px 14px 12px 10px;border:1px solid var(--line);background:var(--sunk);font-size:14px;font-weight:500;counter-increment:s;margin-inline-end:-1px}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-size:12.5px;font-weight:700;margin-inline-end:8px}
.steps li:first-child{border-radius:0 8px 8px 0}.steps li:last-child{border-radius:8px 0 0 8px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--sunk);display:flex;flex-direction:column;gap:6px}
.stat label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.stat input{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;width:100%}
.stat .pct{font-size:12.5px;color:var(--brand);font-weight:600;font-variant-numeric:tabular-nums}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.ring{width:150px;height:150px}
.ring text{font-family:var(--f-display)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:var(--surface)}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--brand)}
.kpi .k{font-size:13px;color:var(--ink-2)}
.kpi.alert .v{color:var(--bad)}
.secbars{display:flex;flex-direction:column;gap:2px}
.secbar{display:grid;grid-template-columns:34px minmax(0,1fr) 150px 48px;gap:12px;align-items:center;padding:9px 10px;border-radius:8px;border:0;background:transparent;text-align:right;cursor:pointer;width:100%}
.secbar:hover{background:var(--sunk)}
.secbar .nm{font-weight:500}
.secbar .tr{height:8px;border-radius:8px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.secbar .tr i{display:block;height:100%;background:var(--brand)}
.secbar .pc{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2);text-align:left}
.secbar .nav-code{width:30px;height:30px}

/* evidence */
.ev-form{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px}
.drop{border:2px dashed var(--line-strong);border-radius:10px;background:var(--sunk);min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px;cursor:pointer;position:relative;overflow:hidden;color:var(--ink-2);font-size:13.5px}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop svg{width:36px;height:36px;color:var(--brand)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--surface)}
.drop .clear{position:absolute;top:8px;left:8px;z-index:2}
.preview-desc{border:1px solid var(--gold);background:var(--gold-soft);border-radius:9px;padding:12px}
.preview-desc label{font-size:12px;font-weight:600;color:var(--gold)}
.preview-desc textarea{width:100%;border:0;background:transparent;resize:vertical;min-height:84px;font-size:15px;line-height:1.9;padding:4px 0}
.preview-desc textarea:focus{outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-strong);background:var(--surface);padding:4px 12px;border-radius:99px;font-size:13px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip .c{font-variant-numeric:tabular-nums;opacity:.75;margin-inline-start:4px}
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ev{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.ev .img{aspect-ratio:16/10;background:var(--sunk);display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--line);max-width:100%;cursor:zoom-in}
.ev .img img{width:100%;height:100%;object-fit:cover;object-position:top}
.ev .img .ph{color:var(--ink-3);font-size:13px}
.ev .body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.ev .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.code{font-family:var(--f-display);font-weight:600;font-size:13px;background:var(--band);color:var(--band-ink);padding:2px 10px;border-radius:6px;letter-spacing:.02em}
.ev .sec{font-size:12px;color:var(--ink-3)}
.ev h4{margin:0;font-size:15px;font-weight:600;line-height:1.5}
.ev .m{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px}
.ev p{margin:0;font-size:13.5px;line-height:1.85;color:var(--ink);border-top:1px dashed var(--line);padding-top:8px}
.ev .acts{display:flex;gap:6px;justify-content:flex-end;padding:8px 12px;border-top:1px solid var(--line);background:var(--sunk)}
.empty{border:1px dashed var(--line-strong);border-radius:10px;padding:26px 16px;text-align:center;color:var(--ink-2);font-size:14px;background:var(--sunk)}
.empty b{display:block;font-family:var(--f-display);font-size:16px;color:var(--ink);margin-bottom:4px}

/* phrases & checklist */
.phr{display:flex;flex-direction:column;gap:8px}
.phr-item{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.phr-item .k{font-weight:600;color:var(--gold);font-size:13.5px}
.phr-item .t{font-size:14px;line-height:1.85}
.check{display:flex;flex-direction:column}
.check label{display:flex;gap:12px;align-items:flex-start;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14.5px}
.check label:last-child{border-bottom:0}
.check input{width:19px;height:19px;accent-color:var(--brand);margin-top:4px;flex:none}
.check input:checked + span{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:9px;padding:10px 14px;font-size:13.5px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--band);color:var(--band-ink);padding:10px 18px;border-radius:9px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.lightbox{position:fixed;inset:0;background:rgba(5,20,19,.85);z-index:60;display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top,0px)) 20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:90vh;border-radius:8px;background:#fff}
.sig-cell{padding:6px 8px!important;white-space:nowrap}
.sig-cell .btn{vertical-align:middle}
.sig-img{height:46px;width:auto;background:#fff;border:1px solid var(--line);border-radius:6px;vertical-align:middle;margin-inline-end:8px}
.sig-add{justify-content:flex-start}
.sig-add .inp{flex:1 1 180px;min-width:0}
.sig-modal{position:fixed;inset:0;background:rgba(5,20,19,.6);z-index:70;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sig-box{background:var(--surface);border-radius:12px;width:min(560px,100%);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.sig-h{display:flex;justify-content:space-between;align-items:center}
.sig-h b{font-family:var(--f-display);font-size:18px}
.sig-pad{width:100%;height:200px;border:2px dashed var(--line-strong);border-radius:10px;background:#fff;touch-action:none;cursor:crosshair}
.sig-hint{margin:0;font-size:12.5px;color:var(--ink-3);text-align:center}
.sig-acts{display:flex;gap:8px;justify-content:flex-end}
.plandoc-b{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.plandoc-b .img{border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:zoom-in;max-width:100%}
.plandoc-b img{width:100%;display:block}
.plandoc-meta p{margin:0 0 8px;line-height:1.9}
@media (max-width:700px){.plandoc-b{grid-template-columns:minmax(0,1fr)}}
.ro .ev-add,.ro [data-addrow],.ro [data-delrow],.ro [data-addev],.ro .sig-add,.ro .act{display:none!important}
.linked-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- state ---------- */
const S={sections:{},evidence:[],signatures:[],ready:false};

let publicView=false;
function assetSrc(id){return (SNAP.amap&&SNAP.amap[id])||("/_blob/"+id)}
if(SNAP.sections){S.sections=JSON.parse(JSON.stringify(SNAP.sections));S.evidence=(SNAP.evidence||[]).slice();S.signatures=(SNAP.signatures||[]).slice()}
let db=null,assets=null,downloads=null,user=null,readOnly=false,memoryOnly=false;
let current="home",evFilter="all",needsRender=false;

const $=s=>document.querySelector(s);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function sec(key){return SECTIONS.find(s=>s.key===key)}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2200)}
function setSave(txt,err){const e=$("#saveState");e.textContent=txt;e.classList.toggle("err",!!err)}

function secData(key){
  if(!S.sections[key]) S.sections[key]={forms:{},tables:{},checks:{}};
  const d=S.sections[key]; d.forms=d.forms||{}; d.tables=d.tables||{}; d.checks=d.checks||{};
  return d;
}
function formVal(key,b){const d=secData(key);if(!d.forms[b.id]) d.forms[b.id]=Object.assign({},b.defaults||{});return d.forms[b.id]}
function tableRows(key,b){const d=secData(key);if(!d.tables[b.id]) d.tables[b.id]=(b.defaults||[]).map(r=>Object.assign({},r));return d.tables[b.id]}

/* ---------- persistence ---------- */
const timers={},chains={},dirty={};
function lsLoad(){try{const r=localStorage.getItem("gifted-file");if(r){const o=JSON.parse(r);S.sections=o.sections||{};S.evidence=o.evidence||[];S.signatures=o.signatures||[]}}catch(e){}}
function lsSave(){try{localStorage.setItem("gifted-file",JSON.stringify({sections:S.sections,evidence:S.evidence,signatures:S.signatures}))}catch(e){}}
function queueSave(key){
  if(readOnly) return;
  dirty[key]=true; setSave("جارٍ الحفظ…");
  clearTimeout(timers[key]); timers[key]=setTimeout(()=>flush(key),650);
  refreshProgress();
}
function flush(key){
  const body=JSON.parse(JSON.stringify(secData(key)));
  chains[key]=(chains[key]||Promise.resolve()).then(async()=>{
    if(db) await db.doc("sections/"+key).set(body); else lsSave();
  }).then(()=>{dirty[key]=false;setSave(memoryOnly?"محفوظ على هذا الجهاز":"تم الحفظ")}).catch(e=>{
    if(e&&e.code==="invalid_argument"){readOnly=true;setSave("عرض فقط",true);render()}
    else if(e&&e.code==="quota_exceeded") setSave("المساحة ممتلئة",true);
    else setSave("تعذّر الحفظ، أعيدي المحاولة",true);
  });
}
async function saveEvidence(ev){
  if(db) await db.doc("evidence/"+ev.id).set(ev); else lsSave();
}
async function removeEvidence(ev){
  S.evidence=S.evidence.filter(x=>x.id!==ev.id);
  if(db) await db.doc("evidence/"+ev.id).delete(); else lsSave();
  if(assets&&ev.img){try{await assets.delete(ev.img)}catch(e){}}
}

/* ---------- progress ---------- */
function secProgress(key){
  const s=sec(key); if(!s.blocks) return null;
  let f=0,t=0;
  for(const b of s.blocks){
    if(b.type==="form"||b.type==="stats"){const v=formVal(key,b);for(const fl of b.fields){t++;if(String(v[fl[0]]||"").trim())f++}}
    else if(b.type==="table"){const rows=tableRows(key,b);const cols=b.cols.filter(c=>c[2]!=="calc");if(!rows.length){t+=cols.length}else rows.forEach(r=>cols.forEach(c=>{t++;if(String(r[c[0]]||"").trim()&&!(c[2]==="status"&&r[c[0]]==="todo")&&!(c[2]==="notest"&&r[c[0]]==="todo"))f++}))}
    else if(b.type==="signsheet"){const rs=sigRows(b.id);t+=Math.max(rs.length,1);f+=rs.filter(r=>r.sig).length}
    else if(b.type==="checklist"){const ch=secData(key).checks;t+=b.items.length;b.items.forEach((_,i)=>{if(ch[i])f++})}
    else if(b.type==="linked"||b.type==="evidence"){const n=S.evidence.filter(e=>e.section===key).length;t+=b.type==="evidence"?4:2;f+=Math.min(n,b.type==="evidence"?4:2)}
  }
  return t?Math.round(f/t*100):0;
}
function overall(){const ks=SECTIONS.filter(s=>s.blocks).map(s=>secProgress(s.key));return Math.round(ks.reduce((a,b)=>a+b,0)/ks.length)}

function byCode(a,b){return (a.code||"").localeCompare(b.code||"",undefined,{numeric:true})}
function nextCode(sectionKey){

}

  h+='<section class="card"><div class="card-h"><h3>ضوابط لقطات الشاشة المعتمدة</h3></div><div class="card-b"><ul style="margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px"><li>أن يظهر في اللقطة اسم المنصة والتاريخ واسم المدرسة متى أمكن.</li><li>إخفاء البيانات الشخصية الحساسة (السجل المدني، أرقام الجوالات) قبل الرفع.</li><li>لقطة واحدة واضحة لكل إجراء، مع وصف إداري موحّد أسفلها.</li><li>يأخذ كل شاهد رمز قسمه تلقائيًا ليسهل الرجوع إليه من الجداول.</li></ul></div></section>';
  return h;
}
function evSel(id,label,k,opts){return '<div class="field"><label for="'+id+'">'+label+'</label><select id="'+id+'" data-ev="'+k+'">'+opts.map(o=>'<option value="'+o[0]+'"'+(draft[k]===o[0]?" selected":"")+'>'+o[1]+'</option>').join("")+'</select></div>'}
function evInp(id,label,k,ph,extra,type){return '<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+(type||"text")+'" data-ev="'+k+'" value="'+esc(draft[k])+'" placeholder="'+esc(ph)+'" '+(extra||"")+'></div>'}

function setDraftFile(f){

function bindDrop(){

async function submitEvidence(){
  if(draft.busy) return;

    const m={too_large:"الصورة أكبر من 20 ميغابايت",unsupported_type:"نوع الملف غير مدعوم، استخدمي PNG أو JPG",quota_or_state:"مساحة التخزين ممتلئة",rate_limited:"محاولات كثيرة، انتظري قليلًا ثم أعيدي",quota_exceeded:"مساحة التخزين ممتلئة"};

/* ---------- signatures ---------- */
function sigRows(sheet){return S.signatures.filter(s=>s.sheet===sheet).sort((a,b)=>(a.order||0)-(b.order||0))}
function fmtStamp(iso){try{const d=new Date(iso);return d.toLocaleDateString("ar-SA-u-ca-gregory-nu-latn",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+d.toLocaleTimeString("ar-SA-u-nu-latn",{hour:"2-digit",minute:"2-digit"})}catch(e){return iso}}
async function saveSigner(r){const body=Object.assign({},r);delete body.id;if(db) await db.doc("signatures/"+r.id).set(body); else lsSave()}
async function addSigner(sheet){
  const n=$("#sigName-"+sheet),ro=$("#sigRole-"+sheet); const name=n.value.trim(); if(!name){toast("اكتبي اسم المعلمة");n.focus();return}
  const r={id:"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),sheet,name,role:ro.value.trim(),sig:null,signedAt:null,order:Date.now()};
  S.signatures.push(r); render(); const nn=$("#sigName-"+sheet); if(nn) nn.focus();
  try{await saveSigner(r)}catch(e){toast("تعذّر الحفظ، أعيدي المحاولة")}
  refreshProgress();
}
async function deleteSigner(id){S.signatures=S.signatures.filter(s=>s.id!==id);render();refreshProgress();try{if(db) await db.doc("signatures/"+id).delete(); else lsSave()}catch(e){toast("تعذّر الحذف")}}
function sigText(sheet){const b=SECTIONS.flatMap(s=>s.blocks||[]).find(x=>x.type==="signsheet"&&x.id===sheet);return (b?b.title:"")+"\nم\tاسم المعلمة\tالتخصص\tالتوقيع\tوقت التوقيع\n"+sigRows(sheet).map((r,i)=>[i+1,r.name,r.role||"",r.sig?"موقّعة":"لم توقّع",r.signedAt?fmtStamp(r.signedAt):""].join("\t")).join("\n")}
function openSignPad(id){
  const r=S.signatures.find(s=>s.id===id); if(!r||readOnly) return;
  const m=document.createElement("div"); m.className="sig-modal"; m.setAttribute("role","dialog"); m.setAttribute("aria-label","توقيع "+r.name);
  m.innerHTML='<div class="sig-box"><div class="sig-h"><div><div class="sec-num">توقيع حضور</div><b>'+esc(r.name)+'</b></div><button class="icon-btn" data-x aria-label="إغلاق">✕</button></div><canvas class="sig-pad" width="10" height="10"></canvas><p class="sig-hint">وقّعي داخل المربع بإصبعكِ أو بالفأرة</p><div class="sig-acts"><button class="btn" data-clr>مسح</button><button class="btn primary" data-ok>اعتماد التوقيع</button></div></div>';
  document.body.appendChild(m);
  const c=m.querySelector("canvas"),ctx=c.getContext("2d"),dpr=Math.max(1,window.devicePixelRatio||1);
  const box=c.getBoundingClientRect(); c.width=box.width*dpr; c.height=box.height*dpr; ctx.scale(dpr,dpr);
  const clear=()=>{ctx.fillStyle="#fff";ctx.fillRect(0,0,box.width,box.height)}; clear();
  ctx.strokeStyle="#14302F";ctx.lineWidth=2.4;ctx.lineCap="round";ctx.lineJoin="round";
  let drawing=false,inked=false,last=null;
  const pt=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  c.addEventListener("pointerdown",e=>{drawing=true;last=pt(e);c.setPointerCapture(e.pointerId);e.preventDefault()});
  c.addEventListener("pointermove",e=>{if(!drawing)return;const p=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;inked=true;e.preventDefault()});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>c.addEventListener(ev,()=>{drawing=false}));
  const close=()=>m.remove();
  m.addEventListener("click",async e=>{
    if(e.target===m||e.target.closest("[data-x]")){close();return}
    if(e.target.closest("[data-clr]")){clear();inked=false;return}
    if(e.target.closest("[data-ok]")){
      if(!inked){toast("لم يُرسم توقيع بعد");return}
      const o=document.createElement("canvas");o.width=360;o.height=Math.round(360*box.height/box.width);o.getContext("2d").drawImage(c,0,0,o.width,o.height);
      r.sig=o.toDataURL("image/png"); r.signedAt=new Date().toISOString(); close(); render(); refreshProgress();
      try{await saveSigner(r);toast("تم اعتماد توقيع "+r.name)}catch(err){toast("تعذّر حفظ التوقيع")}
    }
  });
}

/* ---------- copy as text ---------- */
function formText(key,b){const v=formVal(key,b);return b.title+"\n"+b.fields.map(f=>f[1]+": "+(String(v[f[0]]||"").trim()||"……")).join("\n")}
function tableText(key,b){const rows=tableRows(key,b);const head=["م"].concat(b.cols.map(c=>c[1])).join("\t");return b.title+"\n"+head+"\n"+rows.map((r,i)=>[i+1].concat(b.cols.map(c=>c[2]==="calc"?calcPct(r):(c[2]==="status"?lab(STATUS,r[c[0]]):c[2]==="notest"?lab(NOTE_ST,r[c[0]]):(r[c[0]]||"")))).join("\t")).join("\n")}
function lab(arr,v){const o=arr.find(x=>x[0]===(v||"todo"));return o?o[1]:""}
function sectionText(key){
  const s=sec(key);let out=[s.num+": "+s.title,"","الوصف الإداري:",s.desc,""];
  for(const b of s.blocks){
    if(b.type==="form"||b.type==="stats") out.push(formText(key,b),"");
    else if(b.type==="table") out.push(tableText(key,b),"");
    else if(b.type==="steps") out.push(b.title+"\n"+b.items.map((x,i)=>(i+1)+". "+x).join("\n"),"");
    else if(b.type==="signsheet") out.push(sigText(b.id),"");
    else if(b.type==="checklist"){const ch=secData(key).checks;out.push(b.title+"\n"+b.items.map((x,i)=>(ch[i]?"☑ ":"☐ ")+x).join("\n"),"")}
    else if(b.type==="linked"||b.type==="evidence"){const l=S.evidence.filter(e=>e.section===key).sort(byCode);if(l.length)out.push("الشواهد:\n"+l.map(e=>e.code+" — "+(e.title||"")+"\n"+e.desc).join("\n\n"),"")}
  }
  return out.join("\n");
}
async function copy(t){
  try{await navigator.clipboard.writeText(t);toast("تم النسخ")}
  catch(e){const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("تم النسخ")}catch(_){toast("حدّدي النص وانسخيه يدويًا")}ta.remove()}
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-zoom]"); if(!t) return;
  const d=t.dataset;
  if(d.go){go(d.go);return}
  if(d.addsig&&!readOnly){addSigner(d.addsig);return}
  if(d.sign||d.resign){openSignPad(d.sign||d.resign);return}
  if(d.copysig){copy(sigText(d.copysig));return}
  if(d.delsig&&!readOnly){if(t.classList.contains("armed")){deleteSigner(d.delsig)}else{t.classList.add("armed");t.style.background="var(--bad)";t.style.color="#fff";toast("اضغطي مرة أخرى لتأكيد الحذف");setTimeout(()=>{if(t.isConnected){t.classList.remove("armed");t.style.background="";t.style.color=""}},3000)}return}
  if(d.copytext){copy(d.copytext);return}
  if(d.copysec){copy(sectionText(d.copysec));return}
  if(d.copyform){const [k,id]=d.copyform.split("|");copy(formText(k,blk(k,id)));return}
  if(d.copytable){const [k,id]=d.copytable.split("|");copy(tableText(k,blk(k,id)));return}
  if(d.addrow&&!readOnly){const [k,id]=d.addrow.split("|");const b=blk(k,id);const r={};b.cols.forEach(c=>{if(c[2]==="status"||c[2]==="notest")r[c[0]]="todo"});tableRows(k,b).push(r);queueSave(k);render();const ins=document.querySelectorAll('[data-tbl="'+id+'"][data-row="'+(tableRows(k,b).length-1)+'"]');if(ins[0])ins[0].focus();return}
  if(d.delrow&&!readOnly){const [k,id,i]=d.delrow.split("|");if(t.dataset.armed){tableRows(k,blk(k,id)).splice(+i,1);queueSave(k);render()}else{t.dataset.armed="1";t.style.background="var(--bad)";t.style.color="#fff";t.title="اضغطي مرة أخرى للتأكيد";toast("اضغطي مرة أخرى لتأكيد حذف الصف");setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.style.background="";t.style.color=""}},3000)}return}
  if(d.addev){draft.section=d.addev;draft.descTouched=false;go("evidence");return}
  if(d.evf){evFilter=d.evf;render();return}
  if(d.delev){if(t.classList.contains("armed")){const ev=S.evidence.find(x=>x.id===d.delev);if(ev)removeEvidence(ev).then(()=>{toast("تم حذف الشاهد "+ev.code);render();refreshProgress()}).catch(()=>toast("تعذّر الحذف"))}else{t.classList.add("armed");t.textContent="تأكيد الحذف";setTimeout(()=>{if(t.isConnected){t.classList.remove("armed");t.textContent="حذف"}},3000)}return}
  if(d.zoom!==undefined&&d.zoom){const lb=document.createElement("div");lb.className="lightbox";lb.innerHTML='<img src="'+d.zoom+'" alt="">';lb.onclick=()=>lb.remove();document.body.appendChild(lb);return}
  if(t.id==="saveEv"){submitEvidence();return}
  if(t.id==="resetDesc"){draft.descTouched=false;render();return}
  if(t.id==="exportBtn"){exportFile();return}
});
document.addEventListener("input",e=>{
  const el=e.target,d=el.dataset;
  if(d.ev){
    draft[d.ev]=el.value;
    if(d.ev==="desc"){draft.descTouched=true;return}
    if(!draft.descTouched){draft.desc=fillTpl();const ta=$("#ev-desc");if(ta)ta.value=draft.desc}
    if(d.ev==="section"){const nc=$("#nextCode");if(nc)nc.textContent=nextCode(draft.section)}
    return;
  }
  if(!d.sec||readOnly) return;
  const s=sec(d.sec);
  if(d.form){const b=s.blocks.find(x=>x.id===d.form);formVal(d.sec,b)[d.k]=el.value;if(b.type==="stats")b.fields.forEach(f=>{const p=document.querySelector('[data-statpct="'+f[0]+'"]');if(p)p.textContent=statPct(formVal(d.sec,b),f[0])})}
  else if(d.tbl){const b=s.blocks.find(x=>x.id===d.tbl);const row=tableRows(d.sec,b)[+d.row];if(!row)return;row[d.k]=el.value;if(el.classList.contains("st"))el.dataset.v=el.value;const c=document.querySelector('[data-calc="'+d.sec+'|'+d.tbl+'|'+d.row+'"]');if(c)c.textContent=calcPct(row)}
  queueSave(d.sec);
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.check){const [k,i]=el.dataset.check.split("|");secData(k).checks[i]=el.checked;queueSave(k);const h=el.closest(".card").querySelector(".nav-pct");if(h){const n=Object.values(secData(k).checks).filter(Boolean).length;h.textContent=n+" من 10"}}
  if(el.dataset.ev==="section"||el.dataset.ev==="tpl"){if(!draft.descTouched){draft.desc=fillTpl();const ta=$("#ev-desc");if(ta)ta.value=draft.desc}}
});
document.addEventListener("focusout",()=>{if(needsRender){setTimeout(()=>{if(!isEditing()){needsRender=false;render()}},50)}});
$("#fileInp").addEventListener("change",e=>{const f=e.target.files[0];if(f)setDraftFile(f);e.target.value=""});
document.addEventListener("paste",e=>{
  if(current!=="evidence"||readOnly) return;
  const items=e.clipboardData&&e.clipboardData.items; if(!items) return;
  for(const it of items){if(it.type&&it.type.startsWith("image/")){const f=it.getAsFile();if(f){e.preventDefault();setDraftFile(new File([f],"screenshot.png",{type:f.type||"image/png"}));toast("تم لصق لقطة الشاشة");return}}}
});
function isEditing(){const a=document.activeElement;return a&&$("#main").contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)}
function go(k){if(!sec(k))k="home";current=k;try{if(location.hash!=="#"+k)history.replaceState(null,"","#"+k)}catch(e){}render();window.scrollTo({top:0,behavior:"instant"in window?"instant":"auto"})}
window.addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(k&&k!==current&&sec(k)){current=k;render()}});

/* ---------- boot ---------- */
const h0=location.hash.slice(1); if(sec(h0)) current=h0;
render(); setSave("جارٍ الاتصال…");
(async function boot(){
  const cl=window.claude;
  if(!cl||!cl.use){publicView=true;readOnly=true;setSave("نسخة عرض");render();return}
  const [dbN,asN,dlN,usN]=await Promise.all([cl.use("db"),cl.use("assets"),cl.use("downloads"),cl.use("user")].map(p=>p.catch(()=>null)));
  db=dbN;assets=asN;downloads=dlN;user=usN;
  if(downloads) $("#exportBtn").hidden=false;
  if(!db){publicView=true;readOnly=true;setSave("نسخة عرض");render();return}
  if(user){try{const c=await user.can("data.write");if(c===false)readOnly=true}catch(e){}}
  let first=true;
  db.collection("sections").onSnapshot(snap=>{
    let changed=false;
    snap.docs.forEach(doc=>{if(dirty[doc.id]||doc.metadata.hasPendingWrites)return;const v=doc.data();if(v){S.sections[doc.id]=JSON.parse(JSON.stringify(v));changed=true}});
    if(changed||first){first=false;if(isEditing())needsRender=true;else render()}
    setSave(readOnly?"عرض فقط":"تم الحفظ");
  },err=>setSave("انقطع الاتصال، أعيدي تحميل الصفحة",true));
  db.collection("evidence").onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites) return;
    if(snap.empty&&S.evidence.length) return;
    S.evidence=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    if(isEditing())needsRender=true;else render();
  },()=>{});
  db.collection("signatures").onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites) return;
    S.signatures=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
    if(document.querySelector(".sig-modal")||isEditing())needsRender=true;else render();
  },()=>{});
})();
})();
</script>
